# Render Blueprint (New → Blueprint → this repo). No API keys needed.
services:
  - type: web
    name: ecosync
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Your Neon connection string (neon.tech → project → Connect). Without it the app
      # still runs on a local Postgres file, but data resets on every deploy.
      - key: DATABASE_URL
        sync: false
