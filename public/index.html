<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoSync</title>
<meta name="description" content="A second life for your scrap. Scan it, sell it to a collector nearby, and follow it to its next life with a QR material passport.">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="progress" id="progress"></div>
<div id="intro" class="intro" aria-hidden="true">
  <div class="intro-stage">
    <svg class="intro-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path class="s" d="M12 3.5a8.5 8.5 0 0 1 7.4 4.3"/><path class="s" d="M20.3 13.6a8.5 8.5 0 0 1-8.3 6.9"/><path class="s" d="M7.6 19.3A8.5 8.5 0 0 1 4.2 8.6"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg>
    <div class="intro-word">ecosync</div>
    <div class="intro-line">A second life for your scrap.</div>
  </div>
  <button class="intro-skip" type="button">Skip</button>
</div>
<div id="app"></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="sheet-root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
