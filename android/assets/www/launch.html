<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoSync</title>
<style>
@font-face{font-family:"Instrument Serif";src:url(instrument-serif.woff2) format("woff2")}
@font-face{font-family:"Manrope";src:url(manrope.woff2) format("woff2");font-weight:200 800}
:root{--bg:#0a0a0a;--fg:#f3f3f1;--muted:#a1a19c;--line:#262626;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.6 Manrope,system-ui,sans-serif;display:grid;place-items:center;padding:24px}
.stage{display:grid;justify-items:center;gap:12px;text-align:center;width:min(360px,100%)}
svg{width:56px;height:56px}
.s{stroke-dasharray:140;stroke-dashoffset:140;animation:draw 1s cubic-bezier(.6,0,.2,1) forwards}.s:nth-child(2){animation-delay:.14s}.s:nth-child(3){animation-delay:.28s}
h1{font:800 36px/1 Manrope,sans-serif;letter-spacing:-.06em;margin:0;opacity:0;animation:rise .6s ease-out .75s forwards}
.line{font:400 24px/1.1 "Instrument Serif",Georgia,serif;color:var(--muted);opacity:0;animation:rise .6s ease-out 1.05s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
form{display:grid;gap:10px;width:100%;margin-top:14px;text-align:left}
label{font-size:12px;color:var(--muted)}
input{width:100%;min-height:46px;border-radius:8px;border:1px solid var(--line);background:#0e0e0e;color:var(--fg);padding:0 14px;font:14px ui-monospace,monospace}
button{min-height:48px;border:0;border-radius:8px;font:600 14px Manrope,sans-serif;background:#f6f6f4;color:#0a0a0a}
.err{color:#f1c96b;font-size:13px}
</style></head>
<body><div class="stage">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path class="s" d="M12 3.5a8.5 8.5 0 0 1 7.4 4.3"/><path class="s" d="M20.3 13.6a8.5 8.5 0 0 1-8.3 6.9"/><path class="s" d="M7.6 19.3A8.5 8.5 0 0 1 4.2 8.6"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg>
<h1>ecosync</h1><div class="line" id="msg">A second life for your scrap.</div>
<form id="f" hidden><p class="err" id="why">Can't reach EcoSync right now.</p><label for="u">Site address</label><input id="u" type="url" inputmode="url" autocapitalize="off" spellcheck="false"><button type="submit">Connect</button></form>
</div>
<script>
// Default site address. The GitHub Actions build sets this from APP_URL.
var DEFAULT_URL = "__APP_URL__";
function saved(){try{return localStorage.getItem("server")||DEFAULT_URL}catch(e){return DEFAULT_URL}}
function go(u){u=u.replace(/\/+$/,"");try{localStorage.setItem("server",u)}catch(e){}location.replace(u+"/?app=android#/scan")}
var f=document.getElementById("f"),inp=document.getElementById("u");inp.value=saved();
f.onsubmit=function(e){e.preventDefault();var v=inp.value.trim();if(!/^https?:\/\//.test(v))v="https://"+v;f.hidden=true;document.getElementById("msg").textContent="Connecting…";go(v)};
if(location.hash==="#offline"){f.hidden=false;document.getElementById("msg").textContent="";}
else setTimeout(function(){go(saved())},1800);
</script></body></html>
