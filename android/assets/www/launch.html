<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoSync</title>
<style>
:root{--bg:#0f1f1d;--fg:#e7f0ec;--muted:#95aea7;--line:#2a4a45;--accent:#3ee0a8;--accent-2:#5cc8ff;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(60% 50% at 50% 40%,#132724,var(--bg));color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
.stage{display:grid;justify-items:center;gap:16px;text-align:center;width:min(360px,100%)}
svg{width:104px;height:104px}
.arc{stroke-dasharray:80;stroke-dashoffset:80;animation:draw .7s cubic-bezier(.6,0,.2,1) forwards}.a2{animation-delay:.15s}.a3{animation-delay:.3s}
.tip{opacity:0;animation:pop .35s ease-out forwards}.t1{animation-delay:.7s}.t2{animation-delay:.8s}.t3{animation-delay:.9s}
.core{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:core .5s cubic-bezier(.3,1.6,.5,1) 1s forwards}
h1{font-size:30px;font-weight:650;letter-spacing:-.01em;margin:0;opacity:0;animation:rise .5s ease-out 1.1s forwards}
p{margin:0;color:var(--muted)}.sub{opacity:0;animation:rise .5s ease-out 1.3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{to{opacity:1}}@keyframes core{to{transform:scale(1)}}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
form{display:grid;gap:10px;width:100%;margin-top:8px}
input{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:#132724;color:var(--fg);padding:0 14px;font:14px ui-monospace,monospace}
button{min-height:48px;border:0;border-radius:12px;font-weight:600;font-size:15px;background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#062019}
.err{color:#ffc65c}
</style></head>
<body><div class="stage">
<svg class="intro-mark" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ee0a8"/><stop offset="1" stop-color="#5cc8ff"/></linearGradient>
      </defs>
      <g fill="none" stroke="url(#ig)" stroke-width="9" stroke-linecap="round">
        <path class="arc a1" d="M72.13 17.7 A44 44 0 0 1 104 60"/>
        <path class="arc a2" d="M90.56 91.65 A44 44 0 0 1 38 98.11"/>
        <path class="arc a3" d="M17.31 70.64 A44 44 0 0 1 38 21.89"/>
      </g>
      <g fill="url(#ig)">
        <path class="tip t1" d="M103.7 77.77 L114.99 60.96 L92.99 60.58Z"/>
        <path class="tip t2" d="M22.77 88.96 L31.67 107.14 L43 88.29Z"/>
        <path class="tip t3" d="M53.54 13.27 L33.34 11.9 L44 31.14Z"/>
      </g>
      <circle class="core" cx="60" cy="60" r="11" fill="url(#ig)"/>
    </svg>
<h1>EcoSync</h1><p class="sub" id="msg">Scan it. Sell it. See what it becomes.</p>
<form id="f" hidden><p class="err" id="why">Can't reach the EcoSync server.</p><input id="u" type="url" inputmode="url" autocapitalize="off" spellcheck="false" aria-label="Server address"><button type="submit">Connect</button><p style="font-size:12.5px">Enter the address of your EcoSync site, for example https://ecosync.onrender.com</p></form>
</div>
<script>
// Default server. The GitHub Actions build replaces this with your Render URL.
var DEFAULT_URL = "__APP_URL__";
function saved(){try{return localStorage.getItem("server")||DEFAULT_URL}catch(e){return DEFAULT_URL}}
function go(u){u=u.replace(/\/+$/,"");try{localStorage.setItem("server",u)}catch(e){}location.replace(u+"/?app=android#/scan")}
var f=document.getElementById("f"),inp=document.getElementById("u");
inp.value=saved();
f.onsubmit=function(e){e.preventDefault();var v=inp.value.trim();if(!/^https?:\/\//.test(v))v="https://"+v;document.getElementById("msg").textContent="Connecting…";f.hidden=true;go(v)};
if(location.hash==="#offline"||saved().indexOf("__")===0){f.hidden=false;document.getElementById("msg").textContent="";if(saved().indexOf("__")===0){inp.value="";document.getElementById("why").textContent="Set your EcoSync server address to start."}}
else setTimeout(function(){go(saved())},1700);
</script></body></html>
